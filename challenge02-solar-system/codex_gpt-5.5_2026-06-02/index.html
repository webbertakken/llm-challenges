<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solar system simulation</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #03040a;
        color: #f4f7ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background:
          radial-gradient(circle at 52% 50%, rgba(35, 53, 96, 0.34), transparent 34%),
          radial-gradient(circle at 14% 22%, rgba(109, 72, 131, 0.16), transparent 28%),
          #03040a;
      }

      canvas {
        display: block;
      }

      .hud {
        position: fixed;
        left: clamp(12px, 2vw, 24px);
        bottom: clamp(12px, 2vw, 24px);
        width: min(360px, calc(100vw - 24px));
        padding: 14px 16px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        background: rgba(4, 8, 18, 0.68);
        box-shadow: 0 14px 48px rgba(0, 0, 0, 0.38);
        backdrop-filter: blur(10px);
        pointer-events: none;
      }

      .hud h1 {
        margin: 0 0 8px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .hud p {
        margin: 0;
        color: rgba(244, 247, 255, 0.78);
        font-size: 12px;
        line-height: 1.55;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  </head>
  <body>
    <main aria-label="Animated p5.js solar system simulation"></main>
    <section class="hud" aria-hidden="true">
      <h1>Solar system</h1>
      <p>Drag to pan. Use the mouse wheel to zoom. Press Space to pause, R to reset, and 1-4 to change speed.</p>
    </section>
    <script src="sketch.js"></script>
  </body>
</html>
