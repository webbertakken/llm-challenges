<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solar System — p5.js</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #04060f;
        overflow: hidden;
        font-family:
          ui-monospace, "SF Mono", "Fira Code", Menlo, Consolas, monospace;
      }
      main {
        display: block;
      }
      canvas {
        display: block;
      }
      /* Accessible fallback shown only if the script fails to boot. */
      #fallback {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        color: #cfe3ff;
        font-size: 16px;
        text-align: center;
        padding: 2rem;
      }
    </style>
  </head>
  <body>
    <main id="sketch-holder"></main>
    <noscript>
      <p id="fallback" style="display: flex">
        This solar system simulation requires JavaScript to run.
      </p>
    </noscript>

    <!-- p5.js from CDN (pinned for reproducibility) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.10/p5.min.js"></script>
    <script src="sketch.js"></script>
  </body>
</html>
