<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar system</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #05060f;
      font-family: system-ui, sans-serif;
    }

    main {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      border-radius: 12px;
      box-shadow: 0 0 60px rgba(80, 120, 255, 0.25);
    }
  </style>
</head>
<body>
  <main id="stage"></main>

  <!-- p5.js from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <!-- the sketch -->
  <script src="sketch.js"></script>
</body>
</html>
