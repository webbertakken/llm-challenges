<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar system simulation</title>
    <style>
      :root {
        color-scheme: dark;
        --panel-bg: rgba(5, 10, 20, 0.76);
        --panel-border: rgba(173, 216, 255, 0.28);
        --text-main: #eef7ff;
        --text-dim: #a8c6db;
        --accent: #6fd3ff;
        --accent-2: #ffd36f;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        overflow: hidden;
        background:
          radial-gradient(circle at top, #102545 0%, rgba(16, 37, 69, 0.25) 30%, transparent 52%),
          radial-gradient(circle at 20% 80%, rgba(21, 61, 116, 0.45) 0%, transparent 38%),
          linear-gradient(180deg, #04070d 0%, #07111d 45%, #03060a 100%);
        color: var(--text-main);
        font-family: Georgia, "Times New Roman", serif;
      }

      canvas {
        display: block;
      }

      .hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .panel {
        position: absolute;
        max-width: min(26rem, calc(100vw - 2rem));
        padding: 1rem 1.1rem;
        border: 1px solid var(--panel-border);
        border-radius: 18px;
        background: var(--panel-bg);
        box-shadow: var(--shadow);
        backdrop-filter: blur(12px);
        pointer-events: auto;
      }

      .panel h1,
      .panel h2,
      .panel p {
        margin: 0;
      }

      .intro {
        top: 1rem;
        left: 1rem;
      }

      .intro h1 {
        font-size: clamp(1.4rem, 3vw, 2.2rem);
        letter-spacing: 0.03em;
      }

      .intro p {
        margin-top: 0.55rem;
        color: var(--text-dim);
        line-height: 1.4;
      }

      .intro strong {
        color: var(--accent-2);
      }

      .controls {
        right: 1rem;
        bottom: 1rem;
        display: grid;
        gap: 0.8rem;
      }

      .controls h2 {
        font-size: 1rem;
        margin-bottom: 0.2rem;
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.55rem;
      }

      button {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        padding: 0.58rem 0.9rem;
        background:
          linear-gradient(180deg, rgba(120, 192, 255, 0.2), rgba(120, 192, 255, 0.08));
        color: var(--text-main);
        cursor: pointer;
        font: inherit;
        transition:
          transform 120ms ease,
          border-color 120ms ease,
          background 120ms ease;
      }

      button:hover {
        transform: translateY(-1px);
        border-color: rgba(255, 255, 255, 0.32);
      }

      button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }

      .stats {
        display: grid;
        gap: 0.25rem;
        font-size: 0.95rem;
        color: var(--text-dim);
      }

      .stats span {
        color: var(--text-main);
      }

      .footer-note {
        position: absolute;
        left: 50%;
        bottom: 0.8rem;
        transform: translateX(-50%);
        padding: 0.45rem 0.9rem;
        border-radius: 999px;
        background: rgba(5, 10, 20, 0.55);
        color: rgba(238, 247, 255, 0.74);
        font-size: 0.85rem;
        letter-spacing: 0.02em;
        pointer-events: none;
      }

      @media (max-width: 760px) {
        .intro {
          max-width: calc(100vw - 2rem);
        }

        .controls {
          left: 1rem;
          right: 1rem;
          bottom: 1rem;
          max-width: none;
        }

        .footer-note {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="hud">
      <section class="panel intro" aria-label="Simulation summary">
        <h1>Solar system</h1>
        <p>
          Eight planets orbit a glowing sun with stylised proportions, atmospheric
          starfields, an asteroid belt, and moons around <strong>Earth</strong>,
          <strong>Mars</strong>, <strong>Jupiter</strong>, and <strong>Saturn</strong>.
        </p>
      </section>

      <section class="panel controls" aria-label="Simulation controls">
        <div>
          <h2>Camera</h2>
          <div class="button-row">
            <button id="slower" type="button">Slower</button>
            <button id="faster" type="button">Faster</button>
            <button id="toggle-labels" type="button">Toggle labels</button>
            <button id="reset-view" type="button">Reset view</button>
          </div>
        </div>
        <div class="stats" aria-live="polite">
          <div>Speed: <span id="speed-value">1.00x</span></div>
          <div>Zoom: <span id="zoom-value">1.00x</span></div>
          <div>Focus: <span id="focus-value">Sun-centred</span></div>
        </div>
      </section>

      <div class="footer-note">Drag to pan. Mouse wheel zooms.</div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
    <script src="./sketch.js"></script>
  </body>
</html>
