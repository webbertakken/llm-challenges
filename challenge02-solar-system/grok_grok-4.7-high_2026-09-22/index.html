<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solar System</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070f;
        color: #d5dced;
        font-family: sans-serif;
        overflow: hidden;
        touch-action: none;
        user-select: none;
      }

      #status {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        margin: 0;
        letter-spacing: 0.04em;
      }

      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <p id="status">Loading the orrery…</p>
    <script
      src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"
      onerror="document.getElementById('status').textContent = 'Could not load p5.js from the CDN.'"
    ></script>
    <script src="sketch.js"></script>
  </body>
</html>
