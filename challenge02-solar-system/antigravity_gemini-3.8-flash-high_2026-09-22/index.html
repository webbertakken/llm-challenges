<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar System Simulation</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #03050d;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(10, 15, 30, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      padding: 14px 18px;
      border-radius: 10px;
      pointer-events: auto;
      z-index: 10;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    #hud h1 {
      font-size: 1.1rem;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      color: #ffd166;
      font-weight: 600;
      text-transform: uppercase;
    }
    #hud p {
      font-size: 0.8rem;
      color: #94a3b8;
      line-height: 1.4;
    }
    .controls {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      align-items: center;
    }
    button {
      background: #1e293b;
      border: 1px solid #475569;
      color: #f1f5f9;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:hover {
      background: #334155;
      border-color: #64748b;
    }
    #info-panel {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: rgba(10, 15, 30, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 14px 18px;
      border-radius: 10px;
      max-width: 260px;
      font-size: 0.82rem;
      color: #cbd5e1;
      display: none;
      z-index: 10;
    }
    #info-panel h2 {
      font-size: 1rem;
      color: #38bdf8;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <div id="hud">
    <h1>Solar System Simulation</h1>
    <p>Drag to Pan &bull; Scroll to Zoom &bull; Click planet to focus</p>
    <div class="controls">
      <button id="btn-pause">Pause</button>
      <button id="btn-reset">Reset View</button>
      <label style="font-size: 0.75rem; color: #94a3b8;">Speed:
        <input id="slider-speed" type="range" min="0.1" max="3" step="0.1" value="1" style="vertical-align: middle;" />
      </label>
    </div>
  </div>
  <div id="info-panel">
    <h2 id="info-name">Planet Name</h2>
    <p id="info-desc"></p>
  </div>
  <script src="sketch.js"></script>
</body>
</html>
